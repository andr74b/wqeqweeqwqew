rules.label=Как играть
rule.1.title=Ближе к 21
rule.1.detail=Наберите больше очков, чем дилер, но не больше 21. Туз даёт 1 или 11, картинки — 10.
rule.2.title=Ещё карту или хватит
rule.2.detail=Берите карты, пока не решите остановиться. Дилер берёт карты до 17 и останавливается, в том числе с тузом за 11.
rule.3.title=Ставки и выигрыш
rule.3.detail=Минимум — 5 фишек, с шагом 5. Победа приносит 1:1, блэкджек — 3:2. При ничьей ставка возвращается. Во время раздачи ставку менять нельзя.
rule.4.title=Играйте дальше
rule.4.detail=«Ещё раз» продолжает игру с текущим балансом. «Новая игра» сбрасывает баланс до 1 000 фишек, колоду и результаты. Когда в колоде остаётся меньше 20 карт, перед следующей раздачей её перемешивают.
