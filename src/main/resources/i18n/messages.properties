rules.label=How to play
rule.1.title=Closer to 21
rule.1.detail=Beat the dealer without going over 21. Aces count as 1 or 11; face cards count as 10.
rule.2.title=Hit or stand
rule.2.detail=Take another card or keep your total. The dealer draws to 17 and stands, including when an ace counts as 11.
rule.3.title=Bets and payouts
rule.3.detail=Bet at least 5 chips, in steps of 5. Wins pay 1:1; blackjack pays 3:2. A push returns your bet. Bets are locked during a hand.
rule.4.title=Keep playing
rule.4.detail=Deal again keeps your balance. New game resets the balance to 1,000 chips, the deck and the results. With fewer than 20 cards left, the deck is shuffled before the next hand.
